version: '3.8'

services:
  db:
    image: postgis/postgis:17-3.6
    container_name: taxip_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: taxip_backend    
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MP_APP_ID: "4866870622732729"
      MP_CLIENT_ID: "4866870622732729"
      MP_CLIENT_SECRET: "s0cFANyPbW9FEmWxudQXX6cSE3IEndBW"
      MP_REDIRECT_URI: "https://vmi3714439.tailaee576.ts.net/api/pagos/mp/callback"
      MP_WEBHOOK_URL: "https://vmi3714439.tailaee576.ts.net/api/pagos/webhook/mercadopago"
      MP_WEBHOOK_SECRET: "815e6b7231d7b5d23021cbe99fe8136463d5e8821dd18a790633f0feb9a34390"
      MP_EXCLUDED_PAYMENT_TYPES: "credit_card"
   # ports:
      #- "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://147.93.4.216:8000
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyBI3_ZcSKrsbz9xKUWJGNGazgIQwshVz6o
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: sfy4qupi
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: documentos_preset
    container_name: taxip_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - NEXT_PUBLIC_API_URL=http://147.93.4.216:8000
      - NEXTAUTH_URL=http://147.93.4.216:3000
      - NEXTAUTH_SECRET=TaxipNextAuthSecretSuperSeguro2026
      - AUTH_TRUST_HOST=true
      - BACKEND_INTERNAL_URL=http://backend:8000
      - DATABASE_URL=postgresql://taxip_admin:TaxipProd2026SecurePass@db:5432/taxip_db?sslmode=disable
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyBI3_ZcSKrsbz9xKUWJGNGazgIQwshVz6o
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=sfy4qupi
      - NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=documentos_preset
    depends_on:
      - backend

  landing:
    build:
      context: ./landing
      args:
        NEXT_PUBLIC_API_URL: http://147.93.4.216:8000
        NEXT_PUBLIC_DASHBOARD_URL: http://147.93.4.216:3000
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyBI3_ZcSKrsbz9xKUWJGNGazgIQwshVz6o
    container_name: taxip_landing
    restart: always
    ports:
      - "3001:3000"
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - NEXT_PUBLIC_API_URL=http://147.93.4.216:8000
      - NEXT_PUBLIC_DASHBOARD_URL=http://147.93.4.216:3000
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyBI3_ZcSKrsbz9xKUWJGNGazgIQwshVz6o
    depends_on:
